<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Radares</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    #addRadarButton, #helpButton {
      position: absolute;
      bottom: 20px;
      width: 60px;
      height: 60px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #addRadarButton:hover, #helpButton:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    #addRadarButton {
      right: 20px;
      background-color: #007bff;
    }

    #helpButton {
      right: 100px;
      background-color: #28a745;
    }

    @media (max-width: 600px) {
      #addRadarButton, #helpButton {
        width: 50px;
        height: 50px;
        font-size: 18px;
        bottom: 15px;
      }

      #helpButton {
        right: 80px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="addRadarButton">+</button>
  <button id="helpButton">?</button>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDNCBnqAAcdV3kqx8hN-uMyqSkzIzV4DXc",
      authDomain: "radares-bcn.firebaseapp.com",
      databaseURL: "https://radares-bcn-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "radares-bcn",
      storageBucket: "radares-bcn.appspot.com",
      messagingSenderId: "892778900332",
      appId: "1:892778900332:web:f3c5353d981dda7b4ba149",
      measurementId: "G-C1GT8Q96ZJ",
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Inicializar el mapa
    const map = L.map('map', { attributionControl: false }).setView([41.3784, 2.1924], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const addRadarButton = document.getElementById('addRadarButton');
    const helpButton = document.getElementById('helpButton');
    let addingRadar = false;

    // Función para añadir radar
    addRadarButton.addEventListener('click', () => {
      addingRadar = !addingRadar;
      if (addingRadar) {
        alert('Haz clic en el mapa para añadir un radar.');
        addRadarButton.style.backgroundColor = '#28a745';
        addRadarButton.innerText = '✔';
      } else {
        addRadarButton.style.backgroundColor = '#007bff';
        addRadarButton.innerText = '+';
      }
    });

    // Función de ayuda
    helpButton.addEventListener('click', () => {
      alert('Haz clic en el botón "+" para activar el modo de añadir radares. Luego, haz clic en el mapa y proporciona la información solicitada.');
    });

    // Crear ícono personalizado para un radar basado en su velocidad
    const createRadarIcon = (velocidad) => {
      return L.icon({
        iconUrl: `https://davidvazguijarro.es/velocidades/${velocidad}.png`,
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32],
      });
    };

    // Cargar radares desde Firebase
    const loadRadares = () => {
      database.ref('radares').once('value', (snapshot) => {
        const radares = snapshot.val();
        if (radares) {
          Object.keys(radares).forEach((key) => {
            const radar = radares[key];
            const marker = L.marker([radar.lat, radar.lng], { icon: createRadarIcon(radar.velocidad) }).addTo(map);

            // Mostrar información del radar en el popup
            marker.bindPopup(`
              <div>
                <p><strong>Velocidad:</strong> ${radar.velocidad} km/h</p>
                <p><strong>Carretera:</strong> ${radar.carretera}</p>
                <p><strong>Dirección:</strong> ${radar.direccion}</p>
                <p><strong>Tipo de radar:</strong> ${radar.tipo}</p>
                <button onclick="deleteRadar('${key}', ${radar.lat}, ${radar.lng})" style="background-color: red; color: white; border: none; padding: 5px; border-radius: 5px; cursor: pointer;">Eliminar</button>
              </div>
            `);
          });
        }
      });
    };

    // Eliminar radar
    const deleteRadar = (key, lat, lng) => {
      if (confirm('¿Estás seguro de que deseas eliminar este radar?')) {
        database.ref('radares/' + key).remove();
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) {
            const { lat: markerLat, lng: markerLng } = layer.getLatLng();
            if (markerLat === lat && markerLng === lng) {
              map.removeLayer(layer);
            }
          }
        });
        alert('Radar eliminado correctamente.');
      }
    };

    // Añadir radar al mapa y guardarlo en Firebase
    map.on('click', (e) => {
      if (addingRadar) {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;

        const tipo = prompt("¿Qué tipo de radar es? (remolque, fijo, móvil, tramo):");
        const carretera = prompt("Introduce la carretera o autopista donde se encuentra el radar:");
        const direccion = prompt("Introduce la dirección:");
        const velocidad = prompt("Introduce la velocidad máxima del radar (km/h):");

        if (!tipo || !carretera || !direccion || !velocidad || isNaN(velocidad)) {
          alert('Información no válida. Radar no añadido.');
          return;
        }

        const radar = { lat, lng, velocidad: parseInt(velocidad), tipo, carretera, direccion };
        database.ref('radares').push(radar);

        L.marker([lat, lng], { icon: createRadarIcon(velocidad) }).addTo(map).bindPopup(`
          <div>
            <p><strong>Velocidad:</strong> ${velocidad} km/h</p>
            <p><strong>Carretera:</strong> ${carretera}</p>
            <p><strong>Dirección:</strong> ${direccion}</p>
            <p><strong>Tipo de radar:</strong> ${tipo}</p>
            <button onclick="deleteRadar('${key}', ${lat}, ${lng})" style="background-color: red; color: white; border: none; padding: 5px; border-radius: 5px; cursor: pointer;">Eliminar</button>
          </div>
        `);
        alert('Radar añadido correctamente.');
        addingRadar = false;
        addRadarButton.style.backgroundColor = '#007bff';
        addRadarButton.innerText = '+';
      }
    });

    // Cargar los radares al cargar la página
    loadRadares();
  </script>
</body>
</html>
