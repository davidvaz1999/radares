<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Radares</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .map-button {
      position: absolute;
      bottom: 20px;
      font-size: 20px;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .map-button:hover {
      transform: scale(1.1);
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.3);
    }

    #addRadarButton {
      background-color: #007bff;
      color: white;
      right: 20px;
    }

    #addRadarButton.active {
      background-color: #28a745;
    }

    #radarForm {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
      z-index: 1001;
      width: 90%;
      max-width: 400px;
      font-size: 16px;
      display: none;
    }

    #radarForm label {
      font-weight: bold;
      margin-bottom: 5px;
      display: block;
    }

    #radarForm input,
    #radarForm select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    #radarForm button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    #radarForm .cancel {
      background-color: #ff4d4d;
      color: white;
    }

    #radarForm .save {
      background-color: #007bff;
      color: white;
    }

    .popup-delete-button {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <button id="addRadarButton" class="map-button">+</button>

  <div id="radarForm">
    <label for="radarType">Tipo de Radar</label>
    <select id="radarType">
      <option value="" disabled selected>Selecciona...</option>
      <option value="Remolque">Remolque</option>
      <option value="Fijo">Fijo</option>
      <option value="Móvil">Móvil</option>
      <option value="Tramo">Tramo</option>
    </select>
    <label for="road">Carretera/Autopista</label>
    <input type="text" id="road" placeholder="Ej. AP-7" />
    <label for="direction">Dirección</label>
    <input type="text" id="direction" placeholder="Ej. Sentido Tarragona" />
    <label for="speed">Velocidad (km/h)</label>
    <input type="number" id="speed" placeholder="Ej. 120" />
    <button id="saveRadarButton" class="save">Guardar Radar</button>
    <button id="cancelRadarButton" class="cancel">Cancelar</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDNCBnqAAcdV3kqx8hN-uMyqSkzIzV4DXc",
      authDomain: "radares-bcn.firebaseapp.com",
      databaseURL: "https://radares-bcn-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "radares-bcn",
      storageBucket: "radares-bcn.appspot.com",
      messagingSenderId: "892778900332",
      appId: "1:892778900332:web:f3c5353d981dda7b4ba149",
      measurementId: "G-C1GT8Q96ZJ",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const map = L.map("map").setView([41.3784, 2.1924], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    const addRadarButton = document.getElementById("addRadarButton");
    const radarForm = document.getElementById("radarForm");
    const saveRadarButton = document.getElementById("saveRadarButton");
    const cancelRadarButton = document.getElementById("cancelRadarButton");

    let tempMarker = null;

    function getIconBySpeed(speed) {
      return L.icon({
        iconUrl: `https://davidvazguijarro.es/velocidades/${speed}.png`,
        iconSize: [32, 32],
      });
    }

    function loadRadars() {
      db.ref("radares").on("value", (snapshot) => {
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });

        snapshot.forEach((childSnapshot) => {
          const data = childSnapshot.val();
          const marker = L.marker([data.lat, data.lng], { icon: getIconBySpeed(data.speed) }).addTo(map);

          marker.bindPopup(`
            <b>${data.radarType}</b><br>
            Carretera: ${data.road}<br>
            Dirección: ${data.direction}<br>
            Velocidad: ${data.speed} km/h
            <br><button class="popup-delete-button" onclick="deleteRadar('${childSnapshot.key}')">Eliminar</button>
          `);
        });
      });
    }

    function deleteRadar(id) {
      if (confirm("¿Estás seguro de que deseas eliminar este radar?")) {
        db.ref("radares/" + id).remove();
        alert("Radar eliminado.");
      }
    }

    addRadarButton.addEventListener("click", () => {
      addRadarButton.classList.toggle("active");
      addRadarButton.textContent = addRadarButton.classList.contains("active") ? "✔" : "+";
    });

    map.on("click", (e) => {
      if (addRadarButton.classList.contains("active")) {
        radarForm.style.display = "block";
        if (tempMarker) map.removeLayer(tempMarker);
        tempMarker = L.marker(e.latlng).addTo(map);
      }
    });

    saveRadarButton.addEventListener("click", () => {
      const radarType = document.getElementById("radarType").value;
      const road = document.getElementById("road").value;
      const direction = document.getElementById("direction").value;
      const speed = document.getElementById("speed").value;

      if (radarType && road && direction && speed && tempMarker) {
        const { lat, lng } = tempMarker.getLatLng();
        const newRadar = db.ref("radares").push();
        newRadar.set({ radarType, road, direction, speed, lat, lng });
        alert("Radar añadido correctamente.");
        radarForm.style.display = "none";
        map.removeLayer(tempMarker);
        tempMarker = null;
      } else {
        alert("Por favor, completa todos los campos.");
      }
    });

    cancelRadarButton.addEventListener("click", () => {
      radarForm.style.display = "none";
      if (tempMarker) map.removeLayer(tempMarker);
      tempMarker = null;
    });

    loadRadars();
  </script>
</body>
</html>
