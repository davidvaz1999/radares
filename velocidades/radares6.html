<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADARES REMOLQUE SCT</title>

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f7f7f7;
    }

    header {
      background-color: #2d3e50;
      color: white;
      text-align: center;
      padding: 10px;
      border-bottom: 4px solid #1f2a36;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    #map {
      width: 100%;
      height: calc(100vh - 60px); /* Altura total menos el header */
    }

    /* Estilos para los botones flotantes */
    .popup-button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 0;
      cursor: pointer;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      position: absolute;
      z-index: 1001;
      transition: background-color 0.3s ease, transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .popup-button:hover {
      transform: scale(1.1);
    }

    #infoButton {
      background-color: #28a745;
      bottom: 20px;
      right: 120px;
    }

    #deleteButton {
      background-color: #dc3545;
      bottom: 20px;
      right: 190px;
    }

    #addButton {
      bottom: 20px;
      right: 50px;
    }

    #helpPopup, #deleteRadarPopup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      max-width: 500px;
      width: 80%;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>MAPA DE RADARES DEL SCT</h1>
  </header>

  <div id="map"></div>

  <!-- Botones flotantes -->
  <button id="infoButton" class="popup-button" onclick="toggleHelpPopup()">i</button>
  <button id="deleteButton" class="popup-button" onclick="toggleDeletePopup()">–</button>
  <button id="addButton" class="popup-button" onclick="enableAddRadar()">+</button>

  <!-- Popup de ayuda -->
  <div id="helpPopup">
    <h2>¿Cómo funciona?</h2>
    <p>Puedes añadir información sobre radares de tráfico, tipo, velocidad y ubicación. ¡Ayúdanos a mantener el mapa actualizado!</p>
    <button onclick="toggleHelpPopup()">Cerrar</button>
  </div>

  <!-- Popup para eliminar radar -->
  <div id="deleteRadarPopup">
    <h3>Eliminar Radar</h3>
    <p>Introduce el ID del radar que deseas eliminar:</p>
    <input type="text" id="radarIdToDelete" placeholder="ID del radar">
    <button onclick="deleteRadar()">Eliminar</button>
    <button onclick="toggleDeletePopup()">Cancelar</button>
  </div>

  <!-- Librerías necesarias -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_STORAGE_BUCKET",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID",
      databaseURL: "TU_DATABASE_URL"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Crear el mapa centrado en Barcelona
    const map = L.map('map').setView([41.3784, 2.1924], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Iconos de velocidad
    const speedIcons = {
      10: 'https://davidvazguijarro.es/velocidades/10.png',
      // (Resto de imágenes, igual que antes)
    };

    function enableAddRadar() {
      alert("Click en el mapa para añadir.");
      map.on("click", **Implementación_AQUÍ**);
    }
  </script>
</body>
</html>
