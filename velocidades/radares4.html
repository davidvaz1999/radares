<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radares SCT</title>

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      color: #333;
    }
    header {
      background-color: #2d3e50;
      color: white;
      padding: 10px;
      text-align: center;
      border-bottom: 4px solid #1f2a36;
    }
    h1 {
      font-size: 2rem;
      font-weight: 500;
    }
    #map {
      width: 100%;
      height: 80vh;
    }
    .popup-button {
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 1001;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .popup-button:hover {
      background-color: #0056b3;
    }
    #deleteButton {
      right: 100px;
      background-color: #dc3545;
    }
    #infoButton {
      right: 170px;
      background-color: #28a745;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mapa de Radares SCT</h1>
  </header>

  <div id="map"></div>

  <!-- Botones flotantes -->
  <button id="addButton" class="popup-button" onclick="enableAddRadar()">+</button>
  <button id="deleteButton" class="popup-button" onclick="deleteRadar()">–</button>
  <button id="infoButton" class="popup-button" onclick="showHelp()">i</button>

  <!-- Librerías -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDNCBnqAAcdV3kqx8hN-uMyqSkzIzV4DXc",
      authDomain: "radares-bcn.firebaseapp.com",
      databaseURL: "https://radares-bcn-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "radares-bcn",
      storageBucket: "radares-bcn.appspot.com",
      messagingSenderId: "892778900332",
      appId: "1:892778900332:web:f3c5353d981dda7b4ba149"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Crear mapa centrado en Barcelona
    const map = L.map('map').setView([41.3784, 2.1924], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Íconos de velocidades
    const speedSigns = {
      10: 'https://davidvazguijarro.es/velocidades/10.png',
      20: 'https://davidvazguijarro.es/velocidades/20.png',
      30: 'https://davidvazguijarro.es/velocidades/30.png',
      40: 'https://davidvazguijarro.es/velocidades/40.png',
      50: 'https://davidvazguijarro.es/velocidades/50.png',
      60: 'https://davidvazguijarro.es/velocidades/60.png',
      70: 'https://davidvazguijarro.es/velocidades/70.png',
      80: 'https://davidvazguijarro.es/velocidades/80.png',
      90: 'https://davidvazguijarro.es/velocidades/90.png',
      100: 'https://davidvazguijarro.es/velocidades/100.png',
      110: 'https://davidvazguijarro.es/velocidades/110.png',
      120: 'https://davidvazguijarro.es/velocidades/120.png'
    };

    function getSpeedIcon(speed) {
      return L.icon({
        iconUrl: speedSigns[speed],
        iconSize: [40, 40],
        iconAnchor: [20, 40],
        popupAnchor: [0, -40]
      });
    }

    // Cargar radares desde Firebase
    function loadRadars() {
      database.ref('radars').on('value', (snapshot) => {
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) map.removeLayer(layer); // Limpiar marcadores
        });

        snapshot.forEach((childSnapshot) => {
          const radar = childSnapshot.val();
          const marker = L.marker([radar.lat, radar.lng], {
            icon: getSpeedIcon(radar.speed)
          }).addTo(map);

          marker.bindPopup(
            `<b>Radar</b><br>Velocidad: ${radar.speed} km/h<br>Tipo: ${radar.type}<br>Descripción: ${radar.description}<br>ID: ${childSnapshot.key}`
          );
        });
      });
    }
    loadRadars();

    // Añadir radar
    let addingRadar = false;
    function enableAddRadar() {
      addingRadar = true;
      alert("Haz clic en el mapa para añadir un radar.");
    }

    map.on('click', (e) => {
      if (addingRadar) {
        const speed = prompt("Introduce la velocidad del radar:");
        const type = prompt("Introduce el tipo de radar:");
        const description = prompt("Introduce una descripción:");
        const radarId = Math.random().toString(36).substr(2, 9); // Generar un ID único

        if (speed && type && description && speedSigns[speed]) {
          database.ref('radars/' + radarId).set({
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            speed: parseInt(speed),
            type: type,
            description: description
          });
          addingRadar = false;
        } else {
          alert("Datos inválidos o velocidad no soportada.");
        }
      }
    });

    // Eliminar radar
    function deleteRadar() {
      const radarId = prompt("Introduce el ID del radar a eliminar:");
      if (radarId) {
        database.ref('radars/' + radarId).remove().then(() => {
          alert("Radar eliminado.");
        }).catch((error) => {
          alert("Error eliminando radar: " + error.message);
        });
      }
    }

    // Ayuda
    function showHelp() {
      alert("Añade radares con el botón '+'. Elimina radares con el botón '-'.");
    }
  </script>
</body>
</html>
