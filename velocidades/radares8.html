<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADARES REMOLQUE SCT</title>

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f7f7f7;
    }

    header {
      background-color: #2d3e50;
      color: white;
      text-align: center;
      padding: 10px;
      border-bottom: 4px solid #1f2a36;
    }

    h1 {
      font-size: 1.8rem;
      margin: 0;
    }

    #map {
      width: 100%;
      height: calc(100vh - 60px);
    }

    .popup-button {
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      position: absolute;
      z-index: 1001;
      transition: transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .popup-button:hover {
      transform: scale(1.1);
    }

    #infoButton { background-color: #28a745; bottom: 20px; right: 160px; }
    #deleteButton { background-color: #dc3545; bottom: 20px; right: 100px; }
    #addButton { bottom: 20px; right: 40px; }

    #helpPopup, #deleteRadarPopup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      max-width: 500px;
      width: 80%;
    }

    input { width: 30%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>MAPA DE RADARES DEL SCT</h1>
  </header>

  <div id="map"></div>

  <!-- Botones flotantes -->
  <button id="infoButton" class="popup-button" onclick="toggleHelpPopup()">i</button>
  <button id="deleteButton" class="popup-button" onclick="toggleDeletePopup()">–</button>
  <button id="addButton" class="popup-button" onclick="enableAddRadar()">+</button>

  <!-- Popup de ayuda -->
  <div id="helpPopup">
    <h2>¿Cómo funciona?</h2>
    <p>Puedes añadir información sobre radares de tráfico, tipo, velocidad y ubicación. ¡Ayúdanos a mantener el mapa actualizado!</p>
    <button onclick="toggleHelpPopup()">Cerrar</button>
  </div>

  <!-- Popup para eliminar radar -->
  <div id="deleteRadarPopup">
    <h3>Eliminar Radar</h3>
    <p>Introduce el ID del radar que deseas eliminar:</p>
    <input type="text" id="radarIdToDelete" placeholder="ID del radar">
    <button onclick="deleteRadar()">Eliminar</button>
    <button onclick="toggleDeletePopup()">Cancelar</button>
  </div>

  <!-- Librerías necesarias -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDNCBnqAAcdV3kqx8hN-uMyqSkzIzV4DXc",
      authDomain: "radares-bcn.firebaseapp.com",
      databaseURL: "https://radares-bcn-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "radares-bcn",
      storageBucket: "radares-bcn.appspot.com",
      messagingSenderId: "892778900332",
      appId: "1:892778900332:web:f3c5353d981dda7b4ba149"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Mostrar y ocultar el popup de ayuda
    function toggleHelpPopup() {
      const helpPopup = document.getElementById('helpPopup');
      helpPopup.style.display = helpPopup.style.display === 'block' ? 'none' : 'block';
    }

    // Mostrar y ocultar el popup para eliminar radares
    function toggleDeletePopup() {
      const deleteRadarPopup = document.getElementById('deleteRadarPopup');
      deleteRadarPopup.style.display = deleteRadarPopup.style.display === 'block' ? 'none' : 'block';
    }

    // Crear el mapa centrado en Barcelona
    const map = L.map('map').setView([41.3784, 2.1924], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Íconos de velocidades
    const speedIcons = {
      10: 'https://davidvazguijarro.es/velocidades/10.png',
      20: 'https://davidvazguijarro.es/velocidades/20.png',
      30: 'https://davidvazguijarro.es/velocidades/30.png',
      40: 'https://davidvazguijarro.es/velocidades/40.png',
      50: 'https://davidvazguijarro.es/velocidades/50.png',
      60: 'https://davidvazguijarro.es/velocidades/60.png',
      70: 'https://davidvazguijarro.es/velocidades/70.png',
      80: 'https://davidvazguijarro.es/velocidades/80.png',
      90: 'https://davidvazguijarro.es/velocidades/90.png',
      100: 'https://davidvazguijarro.es/velocidades/100.png',
      110: 'https://davidvazguijarro.es/velocidades/110.png',
      120: 'https://davidvazguijarro.es/velocidades/120.png'
    };

    function getSpeedIcon(speed) {
      return L.icon({
        iconUrl: speedIcons[speed],
        iconSize: [40, 40],
        iconAnchor: [20, 40],
        popupAnchor: [0, -40]
      });
    }

    // Cargar radares desde la base de datos
    function loadRadars() {
      const markers = {};
      database.ref('radars').on('value', (snapshot) => {
        for (const key in markers) {
          map.removeLayer(markers[key]);
          delete markers[key];
        }
        snapshot.forEach((childSnapshot) => {
          const radar = childSnapshot.val();
          const marker = L.marker([radar.lat, radar.lng], {
            icon: getSpeedIcon(parseInt(radar.speed))
          }).addTo(map);

          marker.bindPopup(`
            <b>Radar</b><br>
            ID: ${childSnapshot.key}<br>
            Tipo: ${radar.type}<br>
            Descripción: ${radar.description}<br>
            Velocidad: ${radar.speed} km/h
          `);
          markers[childSnapshot.key] = marker;
        });
      });
    }

    // Añadir un radar
    async function enableAddRadar() {
      alert("Haz clic en el mapa para añadir un radar.");
      map.once('click', async (e) => {
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        const speed = prompt("Ingrese la velocidad del radar (10, 20, ...):");
        const type = prompt("Ingrese el tipo de radar:");
        const description = prompt("Ingrese la descripción del radar:");

        if (!speed || !type || !description || !speedIcons[speed]) {
          alert("Datos inválidos. Asegúrate de que todos los campos sean correctos.");
          return;
        }

        const id = Math.floor(Math.random() * 200) + 1;
        try {
          await database.ref('radars/' + id).set({
            lat,
            lng,
            speed,
            type,
            description
          });
          alert("Radar añadido correctamente.");
        } catch (error) {
          console.error("Error al añadir el radar:", error);
          alert("Error al guardar el radar.");
        }
      });
    }

    // Eliminar un radar
    function deleteRadar() {
      const id = document.getElementById('radarIdToDelete').value;
      if (!id) {
        alert("Por favor, introduce un ID.");
        return;
      }

      database.ref('radars/' + id).once('value').then((snapshot) => {
        if (!snapshot.exists()) {
          alert("Radar no encontrado.");
        } else {
          database.ref('radars/' + id).remove();
          alert("Radar eliminado correctamente.");
        }
      });
    }

    loadRadars();
  </script>
</body>
</html>
