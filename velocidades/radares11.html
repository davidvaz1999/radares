<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radares SCT</title>

  <!-- Estilos de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      color: #333;
    }
    header {
      background-color: #2d3e50;
      color: white;
      padding: 10px 20px;
      text-align: center;
      border-bottom: 4px solid #1f2a36;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin: 0;
    }
    #map {
      width: 100%;
      height: calc(100vh - 60px); /* Ajustar la altura para que no cubra el encabezado */
    }

    /* Estilos de los botones flotantes */
    .popup-button {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1001;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 20px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 28px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s, transform 0.2s;
    }
    .popup-button:hover {
      background-color: #0056b3;
      transform: scale(1.1);
    }

    /* Botones adicionales */
    #deleteButton {
      right: 110px;
      background-color: #dc3545;
    }
    #deleteButton:hover {
      background-color: #b22a36;
    }
    #infoButton {
      right: 190px;
      background-color: #28a745;
    }
    #infoButton:hover {
      background-color: #1e7a33;
    }

    /* Estilos del popup de añadir radar */
    #addRadarPopup {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .popup-content {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 90%;
      width: 300px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    .popup-content input, .popup-content select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .popup-content button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    .popup-content button:hover {
      background-color: #0056b3;
    }

    /* Responsividad */
    @media screen and (max-width: 768px) {
      .popup-button {
        bottom: 20px;
        right: 20px;
        font-size: 24px;
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Mapa de Radares SCT</h1>
  </header>

  <div id="map"></div>

  <!-- Botones flotantes -->
  <button id="addButton" class="popup-button" onclick="enableAddRadar()">+</button>
  <button id="deleteButton" class="popup-button" onclick="deleteRadar()">–</button>
  <button id="infoButton" class="popup-button" onclick="showHelp()">i</button>

  <!-- Popup para añadir radar -->
  <div id="addRadarPopup">
    <div class="popup-content">
      <h2>Añadir Radar</h2>
      <label for="speed">Velocidad (km/h):</label>
      <select id="speed">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="40">40</option>
        <option value="50">50</option>
        <option value="60">60</option>
        <option value="70">70</option>
        <option value="80">80</option>
        <option value="90">90</option>
        <option value="100">100</option>
        <option value="110">110</option>
        <option value="120">120</option>
      </select>
      
      <label for="type">Tipo de radar:</label>
      <input type="text" id="type" placeholder="Ej: Fijo, Móvil, Tramo">

      <label for="description">Descripción:</label>
      <input type="text" id="description" placeholder="Ej: Radar de velocidad en carretera">

      <button onclick="addRadar()">Añadir Radar</button>
    </div>
  </div>

  <!-- Librerías -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDNCBnqAAcdV3kqx8hN-uMyqSkzIzV4DXc",
      authDomain: "radares-bcn.firebaseapp.com",
      databaseURL: "https://radares-bcn-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "radares-bcn",
      storageBucket: "radares-bcn.appspot.com",
      messagingSenderId: "892778900332",
      appId: "1:892778900332:web:f3c5353d981dda7b4ba149"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Crear mapa centrado en Barcelona
    const map = L.map('map').setView([41.3784, 2.1924], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Función para añadir radar
    function enableAddRadar() {
      document.getElementById('addRadarPopup').style.display = 'flex';
    }

    function addRadar() {
      const speed = document.getElementById('speed').value;
      const type = document.getElementById('type').value;
      const description = document.getElementById('description').value;

      if (speed && type && description) {
        map.once('click', (e) => {
          const radarId = Math.random().toString(36).substr(2, 9); // ID único
          database.ref('radars/' + radarId).set({
            lat: e.latlng.lat,
            lng: e.latlng.lng,
            speed: parseInt(speed),
            type: type,
            description: description
          });
          alert('Radar añadido correctamente');
          document.getElementById('addRadarPopup').style.display = 'none'; // Cerrar el popup
        });
      } else {
        alert("Por favor, completa todos los campos.");
      }
    }

    // Función para cargar radares desde Firebase
    function loadRadars() {
      database.ref('radars').on('value', (snapshot) => {
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) map.removeLayer(layer); // Limpiar marcadores
        });

        snapshot.forEach((childSnapshot) => {
          const radar = childSnapshot.val();
          const marker = L.marker([radar.lat, radar.lng], {
            icon: L.icon({
              iconUrl: 'https://example.com/radar-logo.png',  // Cambia a tu logo
              iconSize: [40, 40],
              iconAnchor: [20, 40],
              popupAnchor: [0, -40]
            })
          }).addTo(map);

          marker.bindPopup(
            `<b>Radar</b><br>Velocidad: ${radar.speed} km/h<br>Tipo: ${radar.type}<br>Descripción: ${radar.description}`
          );
        });
      });
    }

    loadRadars();

    // Función para eliminar radar
    function deleteRadar() {
      const radarId = prompt("Introduce el ID del radar a eliminar:");
      if (radarId) {
        database.ref('radars/' + radarId).remove().then(() => {
          alert("Radar eliminado.");
        }).catch((error) => {
          alert("Error eliminando radar: " + error.message);
        });
      }
    }

    // Función para mostrar ayuda
    function showHelp() {
      alert("Añade radares con el botón '+'. Elimina radares con el botón '-'.");
    }
  </script>
</body>
</html>
