<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-auth.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.21.0/firebase-database.js";

    // Configuración para la base de datos de login
    const firebaseConfigLogin = {
      apiKey: "AIzaSyAX4uy3ON91cwK3Tt9r5Eqpucyf4sfv0No",
      authDomain: "login-radares.firebaseapp.com",
      projectId: "login-radares",
      storageBucket: "login-radares.firebasestorage.app",
      messagingSenderId: "661760692554",
      appId: "1:661760692554:web:2da6e767592800380eb1b3",
      measurementId: "G-S2ZCB85HX1"
    };

    // Configuración para la base de datos de radares
    const firebaseConfigRadares = {
      apiKey: "AIzaSyDNCBnqAAcdV3kqx8hN-uMyqSkzIzV4DXc",
      authDomain: "radares-bcn.firebaseapp.com",
      databaseURL: "https://radares-bcn-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "radares-bcn",
      storageBucket: "radares-bcn.appspot.com",
      messagingSenderId: "892778900332",
      appId: "1:892778900332:web:f3c5353d981dda7b4ba149",
      measurementId: "G-C1GT8Q96ZJ"
    };

    // Inicializar Firebase
    const appLogin = initializeApp(firebaseConfigLogin);
    const appRadares = initializeApp(firebaseConfigRadares, "radares");

    const auth = getAuth(appLogin);
    const database = getDatabase(appRadares);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        document.getElementById('userInfo').innerText = `Bienvenido, ${user.email}`;
        fetchRadares();
      }
    });

    const fetchRadares = () => {
      const radaresRef = ref(database, 'radares');
      onValue(radaresRef, (snapshot) => {
        const data = snapshot.val();
        const radaresTableBody = document.getElementById('radares-table-body');
        radaresTableBody.innerHTML = '';

        if (data) {
          const radaresArray = Object.keys(data).map((key) => ({ id: key, ...data[key] }));
          radaresArray.sort((a, b) => (b.last_updated || 0) - (a.last_updated || 0));

          radaresArray.forEach((radar) => {
            const row = document.createElement('tr');
            const lastUpdated = radar.last_updated ? formatDate(radar.last_updated) : 'N/A';
            
            row.innerHTML = `
              <td>${radar.id}</td>
              <td>${radar.direction || 'N/A'}</td>
              <td>${radar.speed || '0'} km/h</td>
              <td>${radar.status || 'unknown'}</td>
              <td>${radar.road || 'N/A'}</td>
              <td>${lastUpdated}</td>
              <td>${radar.radarType || 'N/A'}</td>
              <td>
                ${radar.status !== 'active' ? `<button class="approve-btn" data-id="${radar.id}">Activar</button>` : ''}
                ${radar.status !== 'inactive' ? `<button class="reject-btn" data-id="${radar.id}">Desactivar</button>` : ''}
              </td>
            `;

            radaresTableBody.appendChild(row);
          });

          document.querySelectorAll('.approve-btn').forEach((btn) => {
            btn.addEventListener('click', () => toggleRadarStatus(btn.dataset.id, 'active'));
          });

          document.querySelectorAll('.reject-btn').forEach((btn) => {
            btn.addEventListener('click', () => toggleRadarStatus(btn.dataset.id, 'inactive'));
          });
        }
      });
    };

    const toggleRadarStatus = (id, status) => {
      const radarRef = ref(database, `radares/${id}`);
      update(radarRef, { status, last_updated: Date.now() })
        .then(() => showNotification(`Radar con ID ${id} cambiado a ${status}.`))
        .catch((error) => showNotification(`Error: ${error.message}`));
    };

    const formatDate = (timestamp) => {
      const date = new Date(timestamp);
      return `${date.getDate().toString().padStart(2, '0')}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getFullYear()} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
    };

    const showNotification = (message) => {
      const notification = document.getElementById('notification');
      notification.textContent = message;
      notification.style.display = 'block';
      setTimeout(() => (notification.style.display = 'none'), 3000);
    };

    const logout = () => {
  signOut(auth)
    .then(() => (window.location.href = 'login.html'))
    .catch((error) => console.error("Error al cerrar sesión:", error));
};

// Exponer logout al ámbito global
window.logout = logout;
  </script>

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 20px;
      background-color: #f9f9f9;
      color: #333;
    }

    h1, h2 {
      text-align: center;
    }

    #notification {
      display: none;
      margin: 20px auto;
      padding: 10px;
      max-width: 400px;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      text-align: center;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f4f4f4;
      color: #555;
    }

    button {
      padding: 8px 12px;
      margin: 4px;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .approve-btn {
      background-color: #4CAF50;
    }

    .reject-btn {
      background-color: #F44336;
    }

    .logout-btn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
      color: white;
      background-color: #2196F3;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .logout-btn:hover {
      background-color: #1976D2;
    }

    .logout-btn:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Panel de Administración</h1>
  <h2 id="userInfo">Cargando...</h2>
  <div id="notification"></div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Dirección</th>
        <th>Velocidad</th>
        <th>Estado</th>
        <th>Carrera</th>
        <th>Última actualización</th>
        <th>Tipo de radar</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="radares-table-body"></tbody>
  </table>
  <button class="logout-btn" onclick="logout()">CERRAR SESIÓN</button>
</body>
</html>
