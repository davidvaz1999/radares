<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>LOGIN - AHORRA UNA MULTA</title>
  <!-- Firebase SDK en la versión 8.x.x -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://ahorraunamulta.com/favicon.png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #4caf50, #81c784);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    h1, h2 {
      margin: 0;
      padding: 0;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .login-container h2 {
      color: #333;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .login-container label {
      font-size: 14px;
      color: #555;
      display: block;
      margin-bottom: 5px;
      text-align: left;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border 0.3s ease;
    }

    .login-container input:focus {
      border: 1px solid #4caf50;
      outline: none;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .login-container button:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }

    .login-container .error-message {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 10px;
    }

    /* Responsive Design */
    @media screen and (max-width: 600px) {
      .login-container {
        padding: 20px;
      }

      .login-container h2 {
        font-size: 18px;
      }

      .login-container input, .login-container button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" placeholder="ejemplo@correo.com" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" placeholder="••••••••" required>

      <button type="submit">Iniciar Sesión</button>

      <div class="error-message" id="error-message"></div>
    </form>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAX4uy3ON91cwK3Tt9r5Eqpucyf4sfv0No",
      authDomain: "login-radares.firebaseapp.com",
      projectId: "login-radares",
      storageBucket: "login-radares.firebasestorage.app",
      messagingSenderId: "661760692554",
      appId: "1:661760692554:web:2da6e767592800380eb1b3",
      measurementId: "G-S2ZCB85HX1"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Obtener el formulario de login
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('error-message');

    // Evento de submit en el formulario
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault(); // Evita que el formulario se recargue

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Intentar iniciar sesión con los valores obtenidos
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log("Inicio de sesión exitoso: ", user);
          window.location.href = 'panel_admin';  // Redirige al panel de administración
        })
        .catch((error) => {
          const errorCode = error.code;
          let errorMessageText = "Ocurrió un error al iniciar sesión, probablemente el correo electrónico o la contraseña sean incorrectos.";

          // Personaliza el mensaje de error según el código de error
          if (errorCode === 'auth/invalid-email') {
            errorMessageText = "El correo electrónico no es válido.";
          } else if (errorCode === 'auth/wrong-password') {
            errorMessageText = "La contraseña es incorrecta.";
          } else if (errorCode === 'auth/user-not-found') {
            errorMessageText = "No se encontró un usuario con ese correo electrónico.";
          }

          console.log(errorCode, errorMessageText);
          errorMessage.textContent = errorMessageText;  // Muestra un mensaje de error simplificado
        });
    });
  </script>

</body>
</html>
