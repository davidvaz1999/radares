<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login - Ahorra una Multa</title>
  <!-- Firebase SDK en la versión 8.x.x -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <style>
    /* General Styles */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      margin: 50px auto;
      background-color: #fff;
      padding: 20px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .login-container h2 {
      text-align: center;
      color: #5f6368;
    }

    .login-container label {
      font-size: 14px;
      color: #555;
      display: block;
      margin-bottom: 5px;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-container button:hover {
      background-color: #45a049;
    }

    .login-container .error-message {
      color: red;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }

    /* Responsive Design */
    @media screen and (max-width: 600px) {
      .login-container {
        width: 90%;
        margin: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .login-container h2 {
        font-size: 18px;
      }

      .login-container input, .login-container button {
        font-size: 16px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Iniciar Sesión</h2>

    <form id="loginForm">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" required><br>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" required><br>

      <button type="submit">Iniciar Sesión</button>

      <div class="error-message" id="error-message"></div>
    </form>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAX4uy3ON91cwK3Tt9r5Eqpucyf4sfv0No",
      authDomain: "login-radares.firebaseapp.com",
      projectId: "login-radares",
      storageBucket: "login-radares.firebasestorage.app",
      messagingSenderId: "661760692554",
      appId: "1:661760692554:web:2da6e767592800380eb1b3",
      measurementId: "G-S2ZCB85HX1"
    };

    // Inicializa Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Obtener el formulario de login
    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('error-message');

    // Evento de submit en el formulario
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault(); // Evita que el formulario se recargue

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Intentar iniciar sesión con los valores obtenidos
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          console.log("Inicio de sesión exitoso: ", user);
          window.location.href = 'panel_admin.html';  // Redirige al panel de administración
        })
        .catch((error) => {
          const errorCode = error.code;
          let errorMessageText = "Ocurrió un error al iniciar sesión, probablemente el correo electrónico o la contraseña sean incorrectos.";

          // Personaliza el mensaje de error según el código de error
          if (errorCode === 'auth/invalid-email') {
            errorMessageText = "El correo electrónico no es válido.";
          } else if (errorCode === 'auth/wrong-password') {
            errorMessageText = "La contraseña es incorrecta.";
          } else if (errorCode === 'auth/user-not-found') {
            errorMessageText = "No se encontró un usuario con ese correo electrónico.";
          }

          console.log(errorCode, errorMessageText);
          errorMessage.textContent = errorMessageText;  // Muestra un mensaje de error simplificado
        });
    });
  </script>

</body>
</html>
